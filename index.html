<title>LEADER'S ANSWER（リーダーズ・アンサー）</title>
<style>
:root{
  --bg:#faf8f3; --card:#ffffff; --ink:#262333; --sub:#6f6a7d; --faint:#9a95a8;
  --navy:#20243d; --gold:#8a6d3b; --gold-soft:#f3ecdd; --line:#e6e1d4;
  --red:#9c3d34; --red-soft:#f9eeee;
  --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.75; padding-bottom:86px;}
#app{max-width:560px; margin:0 auto; padding:0 18px;}
header.app{padding:26px 2px 6px; text-align:center;}
header.app .en{font-family:var(--serif); letter-spacing:.22em; font-size:1.06rem; color:var(--navy); font-weight:600;}
header.app .jp{font-size:.72rem; letter-spacing:.34em; color:var(--gold); margin-top:2px;}
header.app .rule{width:44px; height:1px; background:var(--gold); margin:12px auto 0; opacity:.7;}
h1.page{font-family:var(--serif); font-weight:600; font-size:1.28rem; color:var(--navy); margin:20px 0 4px; letter-spacing:.04em;}
h2.sec{font-family:var(--serif); font-weight:600; font-size:1.02rem; color:var(--navy); margin:26px 0 8px; letter-spacing:.05em;}
p.lead{color:var(--sub); font-size:.9rem; margin:4px 0 14px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:12px 0; box-shadow:0 1px 2px rgba(32,36,61,.04);}
.card.tap{cursor:pointer;}
.card.tap:active{background:#fbf9f4;}
.kicker{font-size:.68rem; letter-spacing:.26em; color:var(--gold); margin-bottom:6px;}
.tname{font-family:var(--serif); font-size:1.12rem; font-weight:600; color:var(--navy); line-height:1.5;}
.tid{font-size:.7rem; color:var(--faint); letter-spacing:.12em;}
.badge{display:inline-block; font-size:.68rem; border:1px solid var(--line); border-radius:999px; padding:1px 9px; color:var(--sub); background:#fbf9f4; margin:2px 4px 2px 0;}
.badge.src{border-color:#d9c9a3; color:var(--gold); background:var(--gold-soft);}
.excerpt{color:var(--sub); font-size:.88rem; margin-top:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.btn{display:block; width:100%; border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:12px; padding:14px; font-size:.98rem; font-family:var(--sans); cursor:pointer; text-align:center; margin:14px 0;}
.btn.ghost{background:transparent; color:var(--navy);}
.btn.gold{background:var(--gold); border-color:var(--gold);}
.btn.small{padding:10px; font-size:.9rem;}
.btn:disabled{opacity:.45;}
.btnrow{display:flex; gap:10px;} .btnrow .btn{margin:14px 0;}
nav.tabs{position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); border-top:1px solid var(--line); z-index:50; padding-bottom:env(safe-area-inset-bottom);}
nav.tabs .in{max-width:560px; margin:0 auto; display:flex;}
nav.tabs button{flex:1; background:none; border:none; padding:9px 0 11px; font-family:var(--sans); font-size:.72rem; color:var(--sub); cursor:pointer; letter-spacing:.08em;}
nav.tabs button .ic{display:flex; align-items:center; justify-content:center; height:27px; color:var(--faint);}
nav.tabs button .ic svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.35; stroke-linecap:round; stroke-linejoin:round;}
nav.tabs button.on{color:var(--navy); font-weight:600;}
nav.tabs button.on .ic{color:var(--gold);}
.view{display:none;} .view.on{display:block;}
.back{background:none; border:none; color:var(--gold); font-size:.9rem; padding:10px 0; cursor:pointer; font-family:var(--sans);}
.block{margin:20px 0;}
.block .bhead{font-size:.7rem; letter-spacing:.22em; color:var(--gold); margin-bottom:6px;}
.block .bbody{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px;}
ol.steps{margin:6px 0; padding-left:1.4em;}
ol.steps li{margin:10px 0;}
ul.plain{margin:6px 0; padding-left:1.2em;}
ul.plain li{margin:8px 0;}
.phrase{border-left:3px solid var(--gold-soft); padding:6px 0 6px 12px; margin:10px 0; color:#3c3850;}
.phrase .lab{font-size:.78rem; color:var(--gold); display:block;}
.small{font-size:.82rem; color:var(--sub);}
.srcbox{font-size:.82rem; color:var(--sub); background:#fbf9f4; border:1px dashed #d9c9a3; border-radius:10px; padding:12px 14px;}
details{margin:12px 0;}
summary{cursor:pointer; color:var(--navy); font-size:.92rem; padding:6px 0;}
.emg{border:1px solid #e3c8c2; background:var(--red-soft); border-radius:14px; padding:14px 18px; margin:14px 0; cursor:pointer;}
.emg .t{color:var(--red); font-weight:600; font-family:var(--serif); letter-spacing:.06em;}
.emg .d{font-size:.82rem; color:#7a554f;}
.telrow{display:flex; gap:10px; margin:12px 0;}
.telrow a{flex:1; text-align:center; background:var(--red); color:#fff; text-decoration:none; border-radius:12px; padding:13px; font-weight:600; letter-spacing:.1em;}
.opt{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:9px 0; font-size:.98rem; font-family:var(--sans); cursor:pointer; color:var(--ink);}
.opt.sel{border-color:var(--gold); background:var(--gold-soft);}
.opt .sub{display:block; font-size:.8rem; color:var(--sub); margin-top:2px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; font-size:.86rem; cursor:pointer; font-family:var(--sans); color:var(--sub);}
.chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
input[type=text], textarea, select{width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:1rem; font-family:var(--sans); background:#fff; color:var(--ink);}
textarea{min-height:64px; resize:vertical;}
label.fl{display:block; font-size:.86rem; color:var(--navy); margin:16px 0 6px; font-weight:600;}
.score{display:flex; flex-wrap:wrap; gap:7px; margin:8px 0;}
.score button{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:1rem; cursor:pointer; font-family:var(--sans); color:var(--sub);}
.score button.on{background:var(--navy); color:#fff; border-color:var(--navy);}
.seg{display:flex; gap:8px; margin:8px 0;}
.seg button{flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:11px; font-size:.95rem; cursor:pointer; font-family:var(--sans); color:var(--sub);}
.seg button.on{background:var(--gold-soft); border-color:var(--gold); color:var(--navy); font-weight:600;}
.check{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #f0ebdf; cursor:pointer;}
.check:last-child{border-bottom:none;}
.check input{width:20px; height:20px; margin-top:3px; accent-color:var(--navy); flex:none;}
.check .ct{font-size:.92rem;}
.check .cs{display:block; font-size:.74rem; color:var(--faint);}
.dayrow{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
.dayrow .dt{font-family:var(--serif); color:var(--navy); font-weight:600;}
.stat{font-size:.8rem; color:var(--sub); white-space:nowrap;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; background:var(--navy); color:#fff; padding:11px 22px; border-radius:999px; font-size:.88rem; z-index:99; display:none; box-shadow:0 4px 18px rgba(32,36,61,.25);}
.about p{margin:12px 0; font-size:.94rem;}
.progress{font-size:.76rem; color:var(--faint); letter-spacing:.2em; text-align:center; margin:8px 0 2px;}
.yn{display:flex; gap:8px;}
.yn button{flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px; cursor:pointer; font-family:var(--sans); color:var(--sub); font-size:.9rem;}
.yn button.on{background:var(--gold-soft); border-color:var(--gold); color:var(--navy); font-weight:600;}
.hr{height:1px; background:var(--line); margin:22px 0;}
.notice{background:var(--gold-soft); border-radius:12px; padding:12px 16px; font-size:.86rem; color:#5c4d2a; margin:12px 0;}
</style>
</head>

<script>
"use strict";
const DATA = {"types": [{"id": "MTG-01", "name": "全会一致の圧力を下げる会議設計", "scene": "meeting", "sceneLabel": "会議", "rolesLabel": "社長・現場リーダー（主催者）", "jobAttr": "共通", "distress": "10", "situation": "「今日の会議は、判断を伴う会議ですか」という前提確認から入る（型の対象は判断を伴う会議に限る）。", "steps": ["会議の前に済ませること: (1)社長・リーダーは最初に結論を言わない（議題と「今日決めること」「判断材料」だけを先に提示する）(2)事前に、匿名または書面で各自の意見を取る（「賛成／反対／条件付き」と根拠1〜2行。前日までに提出）(3)反対役を1人、ローテーションで置く (4)数値・事実の確認が必要な判断では、一次情報（売上・稼働・原価・予約数・事故／クレーム記録等）を全員が見える形に置く (5)決定の取り方を先に決める（全会一致を決定の条件にしない）", "主催者が議題と判断材料（一次情報）を提示する。結論は言わない", "事前書面の集計（匿名）を全員で見る。意見が割れた箇所を特定する", "現場担当→係長級→幹部→社長の順に、割れた箇所だけ口頭で確認する", "反対役が「失敗の経路／未確認の事実／反対側の言い分」を述べる", "不足する事実があれば、担当と期限を決める（その場で無理に決めない）", "責任者（社長等）が決定する。反対意見はメモに残す", "決定と理由、保留事項をその場で1枚に残す"], "extraSections": [], "phrases": [{"label": null, "text": "「私の結論は最後に言います。まず現場を見ている人から聞かせてください」"}, {"label": null, "text": "「今日の反対役は○○さんです。反対意見は役割として出してもらいます」"}, {"label": null, "text": "「書面で出た意見では、ここが割れています。割れた所だけ話しましょう」"}, {"label": null, "text": "「数字で確認できる所まで確認してから決めましょう。分からない所は、分からないと書いておきましょう」"}], "prereq": "対象は「判断を伴う会議」に限定する（接客現場の協調まで「自分の意見を言え」と読み替えない）。事前書面シートの項目: 議題／私の判断（賛成・反対・条件付き賛成・判断材料が不足）／根拠（事実・数字・現場で見たこと）／一番心配な点／確認したい事実。反対役はローテーションとし、「役割の発言である」ことの冒頭宣言とセットにする（どちらかを欠いた反対役制度は導入しない方がよい）。", "caution": "同調率「37%」を自社の会議の診断値として使わない。「日本人は同調圧力に弱いから」という説明で型を導入しない。従業員を「試す」ために使わない（わざと間違った総意を作る等）。反対意見が出ることを「会議が荒れる」サインと読まない。匿名の限界: 従業員5名規模では書面の意見は筆跡・言い回し・担当業務で誰のものかほぼ分かってしまう。実質匿名でなければ私的回答の効果は得られない旨を、項目MTG-K2の注記として表示する。", "source": "L13（Asch, 1951／1956; Bond & Smith, 1996 メタ分析、133研究・17か国）。調整要因（味方1人・私的回答・多数派の一致の崩れで同調が大きく下がる方向）は研究の裏付けがあるが、会議設計の型自体の効果量は未検証。", "tier": "research", "form": "designed", "gradeNote": "調整要因からの設計上の翻訳", "showCond": "関心の場面に「会議」を含む／立場が社長または現場リーダー。職種は共通。", "sel": {"roles": ["president", "leader"], "jobs": ["共通"]}, "checkIds": ["MTG-K1", "MTG-K2", "MTG-K3", "MTG-K4", "MTG-K5", "MTG-K6", "MTG-K7"], "phrasesNote": "言い方の例は、原典の逐語引用ではなく、本カードによる翻訳案・言い換え例です。著者の言葉としての引用ではありません。"}, {"id": "MTG-02", "name": "懸念を引き出す3実践（土台づくり・学びへの招待・生産的な応答）", "scene": "meeting", "sceneLabel": "会議", "rolesLabel": "社長・現場リーダー", "jobAttr": "共通", "distress": "09・10", "situation": null, "steps": ["土台づくり: 仕事の性質を言語化する（「これは手順通りに実行する仕事」ではなく「不確実で、相互依存的で、誰にも全貌が見えない仕事だ」と冒頭で明言する）。目的（何が懸かっているか、誰のためか）を結びつける", "学びへの招待: 状況的謙虚さ（リーダーが「自分は見落とすことがある」と公に認める）。具体的に聞く（下記の問い）。仕組み化の例: 全員が順番に一言ずつ言うラウンド、匿名での事前入力、プレモーテム", "生産的な応答: (1)感謝を表す（内容の当否より先に、言ってくれたこと自体に感謝する）(2)失敗のスティグマを外す（失敗を3分類＝基本的な失敗／複雑な失敗／賢い失敗に照らして扱う）(3)明確な違反には毅然と対処する"], "extraSections": [], "phrases": [{"label": null, "text": "「この案が失敗するとしたら、どこから崩れますか？」"}, {"label": null, "text": "「現場で実際に見ている人から見て、私の前提で間違っているところは？」"}, {"label": null, "text": "「まだ口に出ていない懸念が一つあるとしたら、何ですか？」"}, {"label": "異論への応答", "text": "「その懸念、言ってくれて助かります。まず正確に受け取りたいので、私の理解が合っているか確認させてください」"}], "prereq": "発言する側の型（MTG-03の応答、型Cの「事実→影響→提案」）と必ず対にする。対人関係のリスクの具体行動（質問する、助けを求める、ミスを認める、懸念を表明する、未完成のアイデアを出す、異論を唱える）が起きる場として設計する。", "caution": "心理的安全性は「優しくすること」ではない。安全（safety）と快適（comfort）は同義ではない。評価・雇用に直結する強い権力非対称が固定され、発言が実際に不利益に結びつく職場では、個人の「型」だけでは対処できない。ハラスメントや明確な違反行為がある場面では「率直さ」の問題として扱わず、違反への対処・制度的手続きを優先する（第8節へ接続）。", "source": "W03（Edmondson, 1999, Administrative Science Quarterly; 『The Fearless Organization』2018/2019; 『Right Kind of Wrong』2023）。相関レベルの知見はメタ分析で繰り返し支持されるが、介入の因果・効果量は支えられていない。", "tier": "research", "form": "original", "gradeNote": "3実践は本人の枠組み", "showCond": "関心の場面に「会議」を含む／立場が社長または現場リーダー。MTG-01と同点の場合は MTG-01 を先にする。", "sel": {"roles": ["president", "leader"], "jobs": ["共通"]}, "checkIds": ["MTG-K6", "MTG-K7"]}, {"id": "MTG-03", "name": "ミス報告を受けたときの応答（5ステップ）と会議後チェック", "scene": "meeting", "sceneLabel": "会議", "rolesLabel": "社長・現場リーダー", "jobAttr": "共通", "distress": "09・10", "situation": null, "steps": ["遮らない・表情を変えない。まず最後まで聞く", "感謝＋事実確認: 「早く言ってくれて助かった。まず事実を一緒に整理しよう」。内容への評価は後回しにする", "分類する: 基本的な失敗か、複雑な失敗か、賢い失敗か", "人ではなく仕組みを問う（基本・複雑の場合）: 「なぜ気づかなかったか（個人）」ではなく「なぜ気づけない仕組みだったか」", "学びを残して閉じる: 「今回分かったことを一文で残そう。次に同じ場面の人が使える形で」"], "extraSections": [{"title": "会議後チェック（型D抜粋）", "items": ["出た懸念に対して「誰が・いつまでに・どう答えるか」を残したか", "悪い知らせを出した人に、個別にでも感謝を伝えたか"]}], "phrases": [{"label": "基本 ングは同じ場で混ぜない／間を置く、という原則だけを採用し、日数の断定はしない。場・記録の分離: 日常の声かけ（感謝・承認＋小さなコーチング）は営業の流れの中で行い、評価に関わる話は「日を決めた面談」でだけ行う。クレーム後の振り返りメモ、1on1や日常の気づきメモは、評価資料に転記しない。", "caution": "緊急の安全確保が必要な場面（その場で止める指示が先）、評価・処遇が既に決まっている通知の場面、ハラスメント等の申告対応の場面では、本型の「まず理解するために聞く」進め方をそのまま適用しない。ハラスメント・違法行為・安全に関わる場面は「受け止め方の訓練」の対象から外し、制度的手続きを優先する。人手不足・賃金・シフト制度等の構造側の問題を、個人の受け止め方の問題にすり替えない。", "source": "L01（Stone & Heen, 2014。日本語版正式書名『ハーバード あなたを成長させるフィードバックの授業』東洋経済新報社、2016）。実務枠組みであり、枠組みそのものと個別の型の効果は直接には検証されていない。日本語のフレーズ例・手順の番号付け・チェック項目は本カード筆者による言い換え。", "tier": "practice", "form": "adapted", "gradeNote": null, "showCond": "関心の場面に「注意・叱責」を含む／立場が社長または現場リーダー。", "sel": {"roles": ["president", "leader"], "jobs": ["共通"]}, "checkIds": ["FBK-K1"], "phrasesNote": "言い方の例は、原典の逐語引用ではなく、本カードによる翻訳案・言い換え例です。著者の言葉としての引用ではありません。"}, {"id": "FBK-02", "name": "伝える前の5問点検", "scene": "feedback_correction", "sceneLabel": "注意・叱責", "rolesLabel": "社長・現場リーダー", "jobAttr": "共通", "distress": "19", "situation": null, "steps": ["主語は誰か: 文の主語が「あなた（の人格・性格・やる気）」になっていないか。主語を「この作業／この手順／この結果」に置き換える", "直せる情報が入っているか: 受け手が「誤ったやり方（仮説）を捨てて、別のやり方を試せる」具体情報（正しい手順、基準、次の一手）が1つ以上入っているか", "比較が入っていないか: 「○○さんはできている」「普通はできる」という他者・平均との比較（規範的情報）が紛れていないか", "場は公開か、私的か: 他のスタッフ・お客様の前で言おうとしていないか", "「前回からの変化」で言えるか: 絶対評価だけでなく、速度FI（前回からの変化）の形で伝えられるか"], "extraSections": [{"title": "運用ルール（本カード筆者による運用ルール化であり、原論文の処方ではない）", "items": ["5問のうち1つでも引っかかったら、その場で言い換えてから話す。言い換えができない場合は「事実の確認」だけをその場で行い、評価・指示は場を改める"]}], "phrases": [], "prereq": null, "caution": "「課題に注意を向ければ常に良い」はFITの主張ではない（熟達した課題では細部への注意が自動化された遂行を妨げる／誤った仮説を棄却する情報のない結果通知は成績を下げうる／過度に具体的なFIは干渉する）。感謝や喜びの表明自体を禁じる根拠はFITにない。禁じるのは、賞賛を「成績を上げるための手段」として人格に向けて設計すること。数値の読み方: 「フィードバックを受けた人の38%が下手になった」ではない（効果量単位で38%超が負の方向）。FIT自体、原論文が \"preliminary（予備的）\" と位置づける理論であり、支持は部分的。", "source": "L03（Kluger & DeNisi, 1996, Psychological Bulletin。メタ分析: 採択論文131本・効果量607・参加者12,652人、加重平均 d=.41、効果量の38%超が負）。手順・フレーズは原論文にこの形で載っているものではなく、本カード筆者による手順化。", "tier": "research", "form": "designed", "gradeNote": null, "showCond": "関心の場面に「注意・叱責」を含む／立場が社長または現場リーダー。FBK-01と同点の場合は FBK-01 を先にする（種類の仕分けが点検に先立つため）。", "sel": {"roles": ["president", "leader"], "jobs": ["共通"]}, "checkIds": ["FBK-K2", "FBK-K3", "FBK-K4", "FBK-K5"]}, {"id": "FBK-03", "name": "人格→課題への言い換え", "scene": "feedback_correction", "sceneLabel": "注意・叱責", "rolesLabel": "社長・現場リーダー", "jobAttr": "共通", "distress": "19", "situation": null, "steps": [], "extraSections": [], "phrases": [{"label": "×「やる気がないからミスするんだ」", "text": "○「今朝の開店準備で、チェック表の3番（食材の温度記録）が抜けていました。抜けたのは手順の問題として一緒に見ます。次からは、温度を測ったらその場で声に出して番号を言う形にしませんか」"}, {"label": "×「あなたはいつも遅い」", "text": "○「今日のチェックイン対応は、受付から鍵渡しまで前回の平均より4分長くかかっていました。長くなったのは、混雑時の案内の順番のところです。次は先に鍵だけ渡して、案内は後ろの画面に回す順番でやってみましょう」"}, {"label": "×「注意力が足りない」", "text": "○「伝票の金額とレジの金額が1件ずれていました。ずれは、割引伝票を先に処理したときに起きやすい形です。割引の伝票は左に置いて最後にまとめる、に変えてみてください」"}, {"label": "×「君は接客向きだ／向いていない」", "text": "○「お客様への声かけで、目を見て名前を呼ぶ場面では滞在中の再来店の相談が2件出ています。一方で、クレームの最初の応答は手順書の2番（まず復唱する）が飛ぶことがあります。向いている・いないではなく、この2つの場面の手順を分けて練習しましょう」"}, {"label": "×「さすが、あなたは仕事ができる人だ」", "text": "○「今の対応、助かりました。混んだ時間に、先に待ち時間の見通しを伝えたので、お客様が落ち着いて待てていました。あの『先に見通しを言う』進め方を、今日の申し送りに一文残してもらえますか」"}], "prereq": null, "caution": null, "source": "L03 型B（Kluger & DeNisi, 1996 のメタ分析知見に基づく本カード作成例）", "tier": "research", "form": "designed", "gradeNote": null, "showCond": "関心の場面に「注意・叱責」を含む。自由入力・誘導形で「言い方がきつくなった」等の相談があった場合の第2提示としても使う。", "sel": {"roles": ["president", "leader"], "jobs": ["共通"]}, "checkIds": ["FBK-K2", "FBK-K3"], "phrasesNote": "言い方の例は、原典の逐語引用ではなく、本カードによる翻訳案・言い換え例です。著者の言葉としての引用ではありません。"}, {"id": "FBK-04", "name": "伝えた後の戻し方（注意が自己へ行ったサインと修復）", "scene": "feedback_correction", "sceneLabel": "注意・叱責", "rolesLabel": "社長・現場リーダー", "jobAttr": "共通", "distress": "19", "situation": null, "steps": ["人格の話になったら、それ以上人格を論じない", "「話を仕事に戻します」と明示して、基準・手順・次の一手の3点だけを短く再提示する", "その場で結論を迫らず、「次の勤務で、まずこの1点だけ試して、結果を一緒に見ましょう」と、観測可能な次の試行に落として閉じる"], "extraSections": [{"title": "接続", "items": ["夜の振り返りの追加点検（NGT-04）はこの型の点検版である。"]}], "phrases": [], "prereq": null, "caution": null, "source": "L03 型C（Kluger & DeNisi, 1996。本カード筆者による手順化）", "tier": "research", "form": "designed", "gradeNote": null, "showCond": "関心の場面に「注意・叱責」を含む／その日に注意・指導の質疑または記録があった場合に、夜の振り返りへの接続候補として優先する。", "sel": {"roles": ["president", "leader"], "jobs": ["共通"]}, "checkIds": []}, {"id": "FBK-05", "name": "指摘を受けた側の点検（トリガー点検と話の戻し方）", "scene": "feedback_correction", "sceneLabel": "注意・叱責", "rolesLabel": "全立場（補助動線。一般社員・現場リーダー・社長が受け手の場合）", "jobAttr": "共通", "distress": "19", "situation": null, "steps": ["型B トリガー点検 1. 呼吸を置いて即答しない。まず一言だけ返す: 「ありがとうございます。考えてから返事をします」", "型B トリガー点検 2. 3トリガーのどれが鳴っているかを1つ選ぶ: 事実トリガー（内容そのものへの反応）／関係トリガー（言った相手・言い方への反応）／アイデンティティ・トリガー（自分という人間への否定と感じた反応）", "型B トリガー点検 3. 間違い探しを止める質問を1つだけする: 「具体的に、どの場面のことですか」「それが起きると、どんな影響がありますか」「私が見えていない部分があるとしたら、どこですか」", "型B トリガー点検 4. 受け入れる／受け入れないの判断はその場でしない。「聞くこと」と「従うこと」は別だと自分に明示する", "型C 話題のすり替え＝switchtrack に気づいたら 1. 二つの話題に名前を付ける", "型C 話題のすり替え＝switchtrack に気づいたら 2. 関係側の話題を否定しない", "型C 話題のすり替え＝switchtrack に気づいたら 3. 順序を提案して元の話題に戻る。例: 「遅刻の話をしている途中で、私の連絡の仕方の話になりました。どちらも大事ですが、混ぜると両方分からなくなります。先に遅刻の事実だけ確認させてください。連絡の仕方は、そのあと必ず聞きます」", "型C 話題のすり替え＝switchtrack に気づいたら 4. 自分が受け手で話題をすり替えそうになった場合: 言い返したくなった関係上の不満を、その場でぶつけずメモに1行残し、型Bの点検に回す", "型E 盲点アラート: 同じ指摘が2回目に出たら: (1)「前に別の人からも似たことを言われたか」を点検する (2)表情・声の調子・繰り返しパターンのどれに当たりそうかを1つ選ぶ (3)意図ではなく影響で記録する"], "extraSections": [], "phrases": [], "prereq": null, "caution": "相手にトリガーのラベルを貼る使い方は絶対にしない（人格ラベル禁止と同根）。トリガーは自分が自分の反応を点検するための内側の物差しに限定する。", "source": "L01 型B・型C・型E（Stone & Heen, 2014）", "tier": "practice", "form": "adapted", "gradeNote": null, "showCond": "立場を問わず、自由入力で「指摘されて落ち着かない」等があった場合に優先する。朝の提示の主候補にはしない（補助動線）。", "sel": {"roles": [], "jobs": ["共通"], "noSolo": true}, "checkIds": ["FBK-K8"]}, {"id": "FBK-06", "name": "適正な指導の条件（境界の物差し）", "scene": "feedback_correction", "sceneLabel": "注意・叱責", "rolesLabel": "社長・現場リーダー", "jobAttr": "共通", "distress": "13・19", "situation": null, "steps": [], "extraSections": [{"title": "位置づけ", "items": ["これは手順の型ではなく、注意・指導の前に照らす「物差し」。アプリでは FBK-01〜04 の表示に併記する形で使う（単独の朝の提示にはしない）。"]}, {"title": "適正な指導の条件（指針の枠組みを自社の言葉に対にしたもの）", "items": [" text": "相手の現在の習熟を、年齢・勤続でなく作業単位の段階で見たか", "source": "L04 型C"}, {"id": "COA-K6", "text": "目標・期待・評価基準が言語化されているか（曖昧なまま振り返りだけ導入しない）", "source": "C12 第6-2節"}, {"id": "COA-K7", "text": "原則に当てはまらない場面が出たら、原則側を改訂する手続きがあるか", "source": "J19 型A"}, {"id": "COA-K8", "text": "負荷をかける場合、その目的（何の適応力を育てるか）を言葉にして共有したか", "source": "J19 型D"}]}, {"items": [{"id": "CLM-K1", "source": "L09 第2-2節", "text": "暴力行為・セクハラ行為が含まれるか（該当する場合は1人で対応し続けず、すぐに上位者へ引き継ぐ）"}, {"id": "CLM-K2", "source": "L08 第2-2節（出る基準）／L05 型A（アレルギー申告の例）", "text": "食事・アレルギーに関わる内容か"}, {"id": "CLM-K3", "source": "L08 第2-2節", "text": "金額・安全・健康・個人情報・他の客への影響が絡むか"}, {"id": "CLM-K4", "source": "L08 第2-2節", "text": "同じ件で2回目の申し出か"}, {"id": "CLM-K5", "source": "L08 第2-2節", "text": "一次対応者が感情的に限界に近いか"}, {"id": "CLM-K6", "source": "L09（定義・判断観点）", "text": "要求内容に妥当性があるか／手段・態様が社会通念上相当な範囲か（対応手順を決めるための仕分けであり、法的な判定ではない）"}, {"id": "CLM-K7", "source": "L09 第2-1節", "text": "録音・記録の手段と記録用紙が手元にあるか"}, {"id": "CLM-K8", "source": "L11 第2-3節", "text": "緊急時役割（指揮／通報／AED／出迎え／記録）が勤務表に名前で書かれているか"}], "note": "共通＋宿泊・サービス固有", "scene": "claim_customer", "sceneLabel": "クレーム・カスハラ対応"}, {"items": [{"id": "BRF-K1", "source": "L05 型B-2", "text": "今日のリスクを先に挙げたか"}, {"id": "BRF-K2", "source": "L05 型B-1・4", "text": "「誰が止めてもよい・声をかけたことは責めない」を冒頭で宣言したか"}, {"id": "BRF-K3", "source": "L05 型B-3", "text": "止める権限と役割を割り当てたか"}, {"id": "BRF-K4", "source": "L05 型C", "text": "指示を復唱で閉じたか"}], "note": "共通", "scene": "morning_briefing", "sceneLabel": "朝のブリーフィング"}], "sceneNote_claim": "この場面の初動は畳まない（02 第11-3節の例外）。安全に関わる場合は、型の手順より先に安全確保と相談先・通報（110番／119番）を表示する（第8節 HRM-01、14 第4-1節の割り込み優先1）。", "hrm": [{"extraSections": [{"items": ["「今日」タブの固定位置。2タップ以内で初動手順と相談先に届く構成（02 第11-2節）。"], "title": "置き場所"}, {"items": ["カスハラ発生時の初動は CLM-01（L09）に直接つなぐ。被害を受けた側向けの文面の前提: 「乗り切れなかった＝対応力不足」と読ませない。回復は本人の対応力だけで決まらず、周囲の保証と肯定的な評価で進むという前提を明示する（02 第8-3節、10 型D）。"], "title": "カスハラ発生時の初動"}], "form": "designed", "gradeNote": "表示の優先順位の設計は本リサーチ", "id": "HRM-01", "items": ["生命・身体の危険が発生中（暴力、物を投げる、怪我、体調の急変）→ 型の提示より先に、安全確保・人を離すこと・110番／119番への接続を表示する。記録は収まってから。質問は重ねない", "自傷・他害の差し迫った示唆 → 通常の助言を止め、受診・公的な相談窓口への接続を最優先で表示する", "ハラスメントの発生・申立ての言葉（相談を受けた、申立てがあった、性的な被害）→ 初動セット（聴き方の案内＝Phase A では階段の案内まで／記録 HRM-02／相談の階段 HRM-03）を優先表示する。該当性の判定はしない", "判定・認定・処分・診断・税務・補助金実務の要求、不正・監視の依頼 → 線引き応答（出せない理由の明示）＋専門家・公的窓口への接続のみを表示する"], "name": "緊急入口の表示仕様（初動セット）", "source": "02 第8-3節・第11-3節／14 第4-1節／L09（CLM-01）", "tier": "official"}, {"extraSections": [{"items": ["当日中に書く（できれば直後。その日のうちに）", "書く媒体は個人のスマートフォン・ノート（会社の端末・共用PCは使わない）", "1件ごとに分けて書く。後から時系列に並べ直せる形にする", "過去の出来事を後から書き起こす場合は、「○月○日に振り返って記録」と記録日を分けて明記し、当日記録と混ぜない", "分からない点・曖昧な点は「覚えていない」と書く（推測で埋めない）"], "title": "書き方の手順（2-2）"}, {"items": ["信頼できる家族・友人・同僚に、その日のうちに事実を短く送る（例: LINEで「今日○時頃、○○さんに『（発言）』と言われた」）→ 日時つきの送信履歴として残る", "業務上のメール・チャットはスクリーンショットだけでなくデータ自体でも保存する", "体調に異変があれば早めに受診し、職場での出来事を医師に伝える", "録音をする場合は、専門家に相談してから使い道を決める（その場の判断で公開しない）"], "title": "補強の型（2-3）"}, {"items": ["「いつどこで誰が何を何のためにどのように（5W1H）したのかを記録しましょう。後々の事実確認などで有効なので、メモや録音など最適な方法で記録を残すことをお勧めします」（厚生労働省・あかるい職場応援団）"], "title": "公的案内の核"}, {"items": ["評価でなく発言そのものを書く（感情的な表現や個人的評価を書くと「脚色」や「誇張」を疑われる）。記録すること自体が負担になる場合がある。記録は手段であり義務ではない。体調が悪い時期は受診・休養を優先する。記録は「認定」を保証しない（「書けば勝てる」という前提で助言しない）。会社のPCでメモを作ると閲覧・喪失のリスクがある。録音の適法性や証拠としての扱いについて断定しない。"], "title": "留保・禁止条件"}, {"items": ["緊急入口およびハラスメント関連の型の表示から常時たどれる。保管は分離領域＋領域ロック（PIN）。"], "title": "提示条件"}], "form": "original", "gradeNote": null, "id": "HRM-02", "items": ["日時: ○年○月○日（○） ○時○分頃〜○時○分頃", "場所: （フロント裏／厨房／事務所 など具体的に）", "相手: （氏名・立場）", "同席者・目撃者: （いれば氏名。いなければ「なし」と明記）", "言動: 発言は要約せず「 」でそのまま書く。行為は態様まで書く。×「ひどい暴言を浴びせられた」→ ○「『こんなことも分からないのか。頭が悪い』と、大声で3回言われた」", "きっかけ・前後の経緯: （その前に受けていた指示、業務の状況）", "自分の対応: （何と答えたか、黙っていたか、その場を離れたか）", "直後の状態: （体調・気持ちの変化、業務への影響。具体的に）", "関連資料: （メール・チャット・シフト表・録音等の有無と保管場所）", "相談した相手: （相談した場合のみ。日時と相手）"], "name": "記録の型（H12）", "source": "H12（厚生労働省・あかるい職場応援団の公的案内＋弁護士実務による具体化）。信用性を分けるのは具体性・継続性・整合性であり、客観資料と送信履歴で補強の束にする。", "tier": "official"}, {"extraSections": [{"items": ["行為者が社長本人・相談窓口の担当者である → 段2・3を飛ばし段4から", "社内に窓口が実質ない・相談したことが漏れる構造 → 段4から", "体調・精神の不調がある → 階段と並行して、まず受診（こころの耳等の案内）", "身の危険・暴力がある → 相談の前に安全の確保を優先する"], "title": "例外分岐"}, {"items": ["「我慢していてもハラスメントの問題は解決しません。時間が経過すると、逆にエスカレートする可能性もあります」「決して一人で悩まないこと」。相談したこと等を理由に不利益な取扱いをすることは法律で禁止されている。"], "title": "前提の文言（公的案内）"}, {"items": ["担当者が事実関係を聴き取り、本人の同意を得た上で行為者や第三者に話を聴く。ハラスメントに相当する事実があると判断される場合には懲戒処分・配置転換・行為者による謝罪などが行われることがある。相当する事実がないと判断される場合でも問題の解消に向けた話し合いが行われる。本人がメンタル不調をきたしている場合には産業医などによるメンタルケアも勧められる。"], "title": "相談した後の流れ（公的案内）"}, {"items": ["名前を出さずに（匿名で）相談できるか", "相談したことが、会社や相手に伝わるのか。伝わる場合はどの段階か", "相談すると、その先に何が起きるのか", "記録（HRM-02）はどう使われるのか。提出が必須か、手元に置いてよいか", "費用・予約の要否・対応時間（平日のみか等）", "その窓口で扱えない場合、次に紹介してもらえる先はあるか"], "title": "窓口ごとに最初に確認する項目（2-2）"}, {"items": ["本人の代わりに結論を決めない", "階段の全体図を示すところまでが案内の役割", "本人が選んだ段を尊重する", "記録の様式を渡す", "本人が動けない状態のときは段を上げる前に受診を勧める"], "title": "案内する側の型（2-3）"}, {"items": ["階段は「我慢の順序」ではない。社内の段が機能しないことが明らかな場合にまで順序を守らせることは被害の継続を許す。相談しても動かない場合がある。相談は解決の保証ではない。小規模事業場では段2・段3が形だけになることがあり、その場合は段4（外部）が実質の入口。心の不調の相談先は別系統であり、「解決してから治療」にはしない。窓口ごとの匿名相談の可否・情報の伝わり方の詳細は未検証であり、アプリの助言文でも断定しない。"], "title": "留保・禁止条件"}], "form": "original", "gradeNote": "階段への型化は本カード", "id": "HRM-03", "items": ["段1. 記録する（HRM-02）——相談の前に、手元資料をそろえる", "段2. 周囲に相談する——信頼できる同僚・上司。目的: 孤立を解く、目撃・協力の確保、行為者が気づく場合もある", "段3. 会社の窓口・人事に相談する——会社には相談体制の整備が義務づけられている。目的: 会社としての事実確認と措置を引き出す", "段4. 外部の相談窓口に相談する（無料・電話可のものが多い）——総合労働相談コーナー（労働局・労働基準監督署）／労働委員会／法テラス／みんなの人権110番／かいけつサポート 等。目的: 社外の視点での整理、助言、紛争解決援助・調停への接続", "段5. 紛争解決・専門家の段——労働局の紛争解決援助・調停／弁護士・社労士への相談。目的: 話し合いの場の設定、法的な見通しの確認"], "name": "相談の階段（H13）", "source": "H13（厚生労働省・あかるい職場応援団が労働者向けに示す4段階の相談の流れに基づく本カードの型化）", "tier": "official"}, {"extraSections": [{"items": ["接続先は「全国共通の入口」だけを固定表示する。管轄・地域で変わる連絡先は、公式一覧へのリンクを示し、アプリ内に地域別の番号を持たない。ナビダイヤル（0570）は通話料がかかるものが多い。無料と書けるのはフリーダイヤル（0120）等、公式に無料と確認できたものだけにする。緊急時（暴力・怪我・自傷のおそれ）は本リストの順序で選ばせず、110番・119番と安全確保を最上部に出す。「相談」と「申出・届出・請求」は性質が違う。申出に進むと相手方に伝わる手続きもあるため、窓口側で最初に段階を確認する。"], "title": "表示ルール（G13）"}, {"items": ["確認日: 2026-11-11。鮮度管理の対象であり、少なくとも年1回以上、公式サイトで名称・連絡方法・受付条件を照合し、確認日を更新する（02 第6-4節）。"], "title": "確認日"}, {"items": ["「こころの耳電話相   {key:'claim_customer', label:'クレーム・カスハラ対応'},
  {key:'morning_briefing', label:'朝のブリーフィング'},
  {key:'night_review', label:'夜の振り返り'}
];
const SCENE_ORDER = SCENES.map(s=>s.key);
const SCENE_LABEL = {}; SCENES.forEach(s=>SCENE_LABEL[s.key]=s.label);
const ROLES = [
  {key:'president', label:'社長・経営者'},
  {key:'leader', label:'現場リーダー', sub:'店長・主任など'},
  {key:'employee', label:'一般社員', sub:'補助の入口として使えます'}
];
const JOBS = [
  {key:'lodging', label:'宿泊'},{key:'food', label:'飲食'},{key:'retail', label:'小売'},
  {key:'manufacturing', label:'製造'},{key:'construction', label:'建設'},{key:'care', label:'介護・医療'},
  {key:'transport', label:'運輸'},{key:'service', label:'対人サービス'},{key:'other', label:'その他'}
];
const TIER_LABEL = {research:'査読研究', practice:'実務の蓄積', official:'公的指針・法定義務', voice:'現場の声', philosophy:'姿勢・哲学'};
const FORM_LABEL = {original:'原典のまま', reduced:'縮小版', adapted:'転用版', designed:'本リサーチの設計'};
const REASONS = ['理由が薄れた','難しかった','合図に気づかなかった'];

/* ---------- storage ---------- */
const K = {profile:'la_profile', records:'la_records', rotation:'la_rotation', morning:'la_morning', checks:'la_checks', weekly:'la_weekly', harass:'la_harass'};
function load(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
let profile = load(K.profile, null);
let records = load(K.records, {});
let rotation = load(K.rotation, {shown:{}});
let morning = load(K.morning, {});
let checksState = load(K.checks, {});
let weekly = load(K.weekly, []);
/* ハラスメント記録は通常記録と別の保管領域に分ける（入力・ロックはステップ5） */
if(localStorage.getItem(K.harass)===null){ save(K.harass, {records:[]}); }

/* ---------- helpers ---------- */
const $main = document.getElementById('main');
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return dstr(d); }
function dateLabel(ds){ const d=new Date(ds+'T00:00:00'); const w=['日','月','火','水','木','金','土'][d.getDay()]; return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+w+'）'; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>{ t.style.display='none'; }, 2200); }
function cardIdOf(t){ const m = (t.source||'').match(/([A-Z]{1,3}\d{1,2})/); return m ? m[1] : ''; }
function gradeBadges(t){
  let h = '<span class="badge src">出典 '+esc(cardIdOf(t))+'</span>';
  h += '<span class="badge">'+esc(TIER_LABEL[t.tier]||t.tier||'')+'／'+esc(FORM_LABEL[t.form]||t.form||'')+'</span>';
  return h;
}
function dayRec(ds){ if(!records[ds]) records[ds] = {date:ds, scenesViewed:[], review:null}; return records[ds]; }
function logSceneView(scene){ const r = dayRec(todayStr()); if(!r.scenesViewed.includes(scene)){ r.scenesViewed.push(scene); save(K.records, records); } }

/* ---------- navigation ---------- */
let currentTab = 'today';
function go(view, arg){ window.__view = view; window.__arg = arg||null; render(); window.scrollTo(0,0); }
function setTab(tab){ currentTab = tab; document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab)); go(tab); }
document.querySelectorAll('nav.tabs button').forEach(b=>{ b.addEventListener('click', ()=>setTab(b.dataset.tab)); });
function render(){
  const v = window.__view || 'today';
  if(v==='today') renderToday();
  else if(v==='explore') renderExplore(window.__arg);
  else if(v==='records') renderRecords();
  else if(v==='settings') renderSettings();
  else if(v==='profile') renderProfile(window.__arg||0);
  else if(v==='type') renderType(window.__arg);
  else if(v==='review') renderReview();
  else if(v==='emergency') renderEmergency();
  else if(v==='day') renderDay(window.__arg);
  else if(v==='weekly') renderWeekly();
}

/* ---------- morning selection (06 0-2 の単純ルール) ---------- */
function morningCandidates(){
  let list = TYPES.filter(t=>t.scene!=='night_review' && !(t.sel && t.sel.noSolo) && !(t.sel && t.sel.nightFixed));
  if(profile && profile.role){
    list = list.filter(t=>{ const r = t.sel && t.sel.roles; return !r || !r.length || r.includes(profile.role); });
  }
  if(profile && profile.job){
    list = list.filter(t=>{ const j = t.sel && t.sel.jobs; return !j || !j.length || j[0]==='共通' || j.includes(profile.job); });
  }
  return list;
}
function pickMorning(){
  const td = todayStr();
  if(morning.date===td && morning.typeId && TYPE_BY_ID[morning.typeId]) return TYPE_BY_ID[morning.typeId];
  const cands = morningCandidates();
  if(!cands.length) return null;
  const yrec = records[yesterdayStr()];
  const yScenes = (yrec && yrec.scenesViewed) || [];
  function rank(t){
    const interest = (profile && profile.interests && profile.interests.includes(t.scene)) ? 0 : 1;
    const j = t.sel && t.sel.jobs;
    const jobRank = (profile && profile.job && j && j.length && j[0]!=='共通') ? 0 : 1;
    const yest = yScenes.includes(t.scene) ? 0 : 1;
    return [interest, jobRank, yest, SCENE_ORDER.indexOf(t.scene)];
  }
  const sorted = cands.slice().sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    for(let i=0;i<ra.length;i++){ if(ra[i]!==rb[i]) return ra[i]-rb[i]; }
    const la = rotation.shown[a.id] || '', lb = rotation.shown[b.id] || '';
    if(la!==lb) return la < lb ? -1 : 1;
    return TYPES.indexOf(a) - TYPES.indexOf(b);
  });
  const pick = sorted[0];
  morning = {date: td, typeId: pick.id};
  save(K.morning, morning);
  rotation.shown[pick.id] = td;
  save(K.rotation, rotation);
  const r = dayRec(td); r.morningTypeId = pick.id; save(K.records, records);
  return pick;
}
</script>
<script>
"use strict";
/* ---------- 今日 ---------- */
function typeCardHTML(t, kicker){

/* ---------- 緊急入口（HRM-01 初動＋HRM-04 窓口の表示） ---------- */

/* ---------- 型の詳細（02 第4-4節の表示作法） ---------- */
function gradeNoteHTML(t){
  let h = '<div class="srcbox"><div style="margin-bottom:4px;">'+gradeBadges(t)+'</div>'
    + '<div>出典: '+esc(t.source||'')+'</div>';
  if(t.form && t.form!=='original'){ h += '<div style="margin-top:4px;">この型は'+esc(FORM_LABEL[t.form])+'です。原典の結論そのものではなく、有効性は未検証です。</div>'; }

function typeDetailHTML(t, showBack){
  logSceneView(t.scene);
  let h = '';
  if(showBack) h += '<button class="back" id="bk">← 戻る</button>';
  h += '<div style="margin-top:6px;"><span class="badge">'+esc(SCENE_LABEL[t.scene]||t.sceneLabel||'')+'</span><span class="tid">'+esc(t.id)+'</span></div>'

    + '<div>'+gradeBadges(t)+'</div>';

    h += '<div class="block"><div class="bhead">いまの状況への一言</div><div class="bbody">'

function renderType(id){

function renderExplore(arg){
  if(arg && SCENE_LABEL[arg]) exploreScene = arg;

  h += '<h2 class="sec">'+esc(SCENE_LABEL[exploreScene])+'の型（'+list.length+'件）</h2>';

  list.forEach(t=>{ h += typeCardHTML(t, null); });
  const cl = CHECKLISTS.find(c=>c.scene===exploreScene);
  if(cl){
    const st = (checksState[todayStr()]||{});
    h += '<h2 class="sec">'+esc(SCENE_LABEL[exploreScene])+'のチェック表</h2>';
    h += '<div class="card"><p class="small" style="margin-top:0;">細かく入力するほど、その状況に合った型と手順を返せます。</p>';

      h += '<label class="check"><input type="checkbox" data-check="'+esc(it.id)+'"'+(st[it.id]?' checked':'')+'><span><span class="ct">'+esc(it.text)+'</span><span class="cs">出典: '+esc(it.source||'')+'</span></span></label>';

      + GAPS.map(g=>'<p style="margin:10px 0;"><strong>'+esc(g.title)+'</strong><br><span class="small">'+esc(g.handling||'')+'</span></p>').join('')
      + '</div></details>';

    checksState[td][cb.dataset.check] = cb.checked; save(K.checks, checksState);
  }));
  bindTypeCards($main);
}

<script>
"use strict";
/* ---------- プロフィール（段階式） ---------- */
let profDraft = null;
function renderProfile(step){
  if(!profDraft){ profDraft = profile ? JSON.parse(JSON.stringify(profile)) : {role:null, job:null, shift:null, oncall:null, family:null, size:null, interests:[]}; }
  const d = profDraft;
  let h = '<button class="back" id="bk">← 戻る</button><div class="progress">プロフィール　'+(step+1)+' / 4</div>';
  if(step===0){
    h += '<h1 class="page">あなたの立場は</h1><p class="lead">当てはまるものを1つ選んでください。すべて任意で、後から変えられます。</p>';
    ROLES.forEach(r=>{ h += '<button class="opt'+(d.role===r.key?' sel':'')+'" data-role="'+r.key+'">'+esc(r.label)+(r.sub?'<span class="sub">'+esc(r.sub)+'</span>':'')+'</button>'; });
  } else if(step===1){
    h += '<h1 class="page">職種・業種は</h1><p class="lead">型の出し分けに使います。</p>';
    JOBS.forEach(j=>{ h += '<button class="opt'+(d.job===j.key?' sel':'')+'" data-job="'+j.key+'">'+esc(j.label)+'</button>'; });
  } else if(step===2){
    h += '<h1 class="page">勤務の形は</h1><p class="lead">ある場合は選んでください。</p>';
    h += '<button class="opt'+(d.shift?' sel':'')+'" id="tgShift">交代勤務・夜勤がある</button>';
    h += '<button class="opt'+(d.oncall?' sel':'')+'" id="tgOncall">当直・オンコールがある</button>';
    h += '<p class="small">どちらも無ければ、そのまま次へ進んでください。</p>';
  } else {
    h += '<h1 class="page">もう少しだけ（任意）</h1><p class="lead">分かる範囲でかまいません。飛ばしても使えます。</p>';
    h += '<label class="fl">事業の形</label>';
    h += '<button class="opt'+(d.family===true?' sel':'')+'" id="famYes">家族経営である</button>';
    h += '<button class="opt'+(d.family===false?' sel':'')+'" id="famNo">家族経営ではない</button>';
    h += '<label class="fl">従業員の規模</label><div class="seg">'
      + [['few','数名'],['mid','〜50名'],['large','それ以上']].map(x=>'<button data-size="'+x[0]+'" class="'+(d.size===x[0]?'on':'')+'">'+x[1]+'</button>').join('') + '</div>';
    h += '<label class="fl">関心の場面（よく直面する場面。複数選べます）</label><div class="chips">'
      + SCENES.filter(s=>s.key!=='night_review').map(s=>'<button class="chip'+((d.interests||[]).includes(s.key)?' on':'')+'" data-int="'+s.key+'">'+esc(s.label)+'</button>').join('') + '</div>';
  }
  h += '<div class="btnrow">'
    + (step>0 ? '<button class="btn ghost" id="prev">戻る</button>' : '<button class="btn ghost" id="skipAll">飛ばす</button>')
    + (step<3 ? '<button class="btn" id="next">次へ</button>' : '<button class="btn gold" id="finish">保存する</button>')
    + '</div>';
  $main.innerHTML = h;
  document.getElementById('bk').addEventListener('click', ()=>{ profDraft=null; go('today'); });
  $main.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click', ()=>{ d.role=b.dataset.role; renderProfile(0); }));
  $main.querySelectorAll('[data-job]').forEach(b=>b.addEventListener('click', ()=>{ d.job=b.dataset.job; renderProfile(1); }));
  const ts=document.getElementById('tgShift'); if(ts) ts.addEventListener('click', ()=>{ d.shift=!d.shift; renderProfile(2); });
  const to=document.getElementById('tgOncall'); if(to) to.addEventListener('click', ()=>{ d.oncall=!d.oncall; renderProfile(2); });
  const fy=document.getElementById('famYes'); if(fy) fy.addEventListener('click', ()=>{ d.family=true; renderProfile(3); });
  const fn=document.getElementById('famNo'); if(fn) fn.addEventListener('click', ()=>{ d.family=false; renderProfile(3); });
  $main.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click', ()=>{ d.size=b.dataset.size; renderProfile(3); }));
  $main.querySelectorAll('[data-int]').forEach(b=>b.addEventListener('click', ()=>{ const k=b.dataset.int; const i=(d.interests||[]).indexOf(k); if(i>=0) d.interests.splice(i,1); else d.interests.push(k); renderProfile(3); }));
  const pv=document.getElementById('prev'); if(pv) pv.addEventListener('click', ()=>renderProfile(step-1));
  const nx=document.getElementById('next'); if(nx) nx.addEventListener('click', ()=>renderProfile(step+1));
  const sk=document.getElementById('skipAll'); if(sk) sk.addEventListener('click', ()=>{ d.onboarded=true; profile=d; save(K.profile, profile); profDraft=null; morning={}; save(K.morning, morning); toast('保存しました'); go('today'); });
  const fin=document.getElementById('finish'); if(fin) fin.addEventListener('click', ()=>{ d.onboarded=true; profile=d; save(K.profile, profile); profDraft=null; morning={}; save(K.morning, morning); toast('プロフィールを保存しました'); go('today'); });
}

/* ---------- 夜の振り返り ---------- */
let revDraft = null;
function ngtType(id){ return TYPE_BY_ID[id]; }
function fixedSix(){
  const t = ngtType('NGT-01'); if(!t) return [];
  const es = (t.extraSections||[]).find(e=>/固定6問/.test(e.title||''));
  return es ? es.items : [];
}
function renderReview(){
  const td = todayStr();
  const rec = dayRec(td);
  if(!revDraft){
    const ex = rec.review || {};
    revDraft = {
      theme: ex.theme || (rec.morningTypeId ? 'morning' : 'q1'),
      score: ex.score || null, did: ex.did || null, memo: ex.memo || '',
      goods: ex.goods && ex.goods.length ? ex.goods.map(g=>({t:g.t||'', w:g.w||''})) : [{t:'',w:''},{t:'',w:''},{t:'',w:''}],
      ngt3done: (ex.ngt3 && typeof ex.ngt3.done==='boolean') ? ex.ngt3.done : null,
      ngt3reason: ex.ngt3 ? ex.ngt3.reason : null,
      ngt4: ex.ngt4 || {q1:null,q2:null,q3:null},
      ngt5: ex.ngt5 || {q1:null,q2:null,q3:null}
    };
  }
  const d = revDraft;
  const mType = rec.morningTypeId ? TYPE_BY_ID[rec.morningTypeId] : null;
  const six = fixedSix();
  let h = '<button class="back" id="bk">← 戻る</button><h1 class="page">夜の振り返り</h1>'
    + '<p class="lead">'+esc(dateLabel(td))+'の記録です。書けない日は、書けないことがそのまま記録になります。</p>';
  /* NGT-01 */
  h += '<h2 class="sec">1. 能動的質問（1〜10点）</h2><div class="card">';
  h += '<label class="fl" style="margin-top:0;">今日のテーマ</label><select id="rvTheme">'
    + (mType ? '<option value="morning"'+(d.theme==='morning'?' selected':'')+'>朝の型: '+esc(mType.name)+'</option>' : '')
    + six.map((q,i)=>'<option value="q'+(i+1)+'"'+(d.theme==='q'+(i+1)?' selected':'')+'>'+esc(q)+'</option>').join('')
    + '</select>';
  const themeText = d.theme==='morning' && mType ? '今日、「'+mType.name+'」を意識して動けたか' : (six[parseInt((d.theme||'q1').slice(1))-1] || '');
  h += '<p style="margin:12px 0 4px;">'+esc(themeText)+'</p>';
  h += '<div class="score">' + Array.from({length:10},(_,i)=>'<button data-score="'+(i+1)+'" class="'+(d.score===i+1?'on':'')+'">'+(i+1)+'</button>').join('') + '</div>';
  h += '<label class="fl">実践の有無</label><div class="seg">'
    + ['○','△','×'].map(x=>'<button data-did="'+x+'" class="'+(d.did===x?'on':'')+'">'+x+'</button>').join('') + '</div>';
  h += '<label class="fl">相手の反応メモ（1行）</label><input type="text" id="rvMemo" value="'+esc(d.memo)+'" placeholder="相手の反応を1行で">';
  h += '<p class="small">点数は実践度の記録です。比べるためのものではありません。</p></div>';
  /* NGT-02 */
  h += '<h2 class="sec">2. 3つの良いこと</h2><div class="card">'
    + '<p class="small" style="margin-top:0;">うまくいったこと・良かったことを、最大3つまで。各々に「なぜ起きたか」を1文添えます。まず1週間だけ試す形です。</p>';
  d.goods.forEach((g,i)=>{
    h += '<label class="fl">良かったこと '+(i+1)+'</label><input type="text" data-good-t="'+i+'" value="'+esc(g.t)+'">'
      + '<label class="fl">なぜ起きたか</label><input type="text" data-good-w="'+i+'" value="'+esc(g.w)+'">';
  });
  h += '<p class="small">書けない日は「悪くならなかったこと」まで広げてかまいません。</p></div>';
  /* NGT-03 */
  const n3 = ngtType('NGT-03');
  h += '<h2 class="sec">3. 称賛と再設計</h2><div class="card">'
    + '<label class="fl" style="margin-top:0;">今日の小さな実践は、できましたか</label><div class="seg">'
    + '<button data-n3="yes" class="'+(d.ngt3done===true?'on':'')+'">できた</button>'
    + '<button data-n3="no" class="'+(d.ngt3done===false?'on':'')+'">できなかった</button></div>';
  if(d.ngt3done===true && n3){
    (n3.phrases||[]).filter(p=>/^○/.test(p.label||'')).forEach(p=>{ h += '<div class="phrase">'+esc(p.text)+'</div>'; });
  }
  if(d.ngt3done===false){
    h += '<label class="fl">理由はどれに近いですか（翌日の提示を小さくするために使います）</label><div class="seg">'
      + REASONS.map(r=>'<button data-reason="'+esc(r)+'" class="'+(d.ngt3reason===r?'on':'')+'">'+esc(r)+'</button>').join('') + '</div>'
      + '<p class="small">1回休んだことを、失敗として扱いません。</p>';
  }
  h += '</div>';
  /* NGT-04 insert */
  const engaged = (rec.scenesViewed||[]).some(s=>s==='feedback_correction'||s==='coaching_guidance') || (mType && (mType.scene==='feedback_correction'||mType.scene==='coaching_guidance'));
  if(engaged){
    h += '<h2 class="sec">追加点検: 注意・指摘は人格に向かっていなかったか</h2><div class="card">'
      + '<p class="small" style="margin-top:0;">今日、注意・叱責や指導の場面があった日の点検です（NGT-04）。</p>'
      + [['q1','注意が自己（人格）へ向いたサインは出ていなかったか'],['q2','出ていた場合、話を仕事（基準・手順・次の一手）に戻せたか'],['q3','次に試す1点を決めたか']].map(x=>
        '<label class="fl">'+x[1]+'</label><div class="yn">'
        + '<button data-n4="'+x[0]+':true" class="'+(d.ngt4[x[0]]===true?'on':'')+'">はい</button>'
        + '<button data-n4="'+x[0]+':false" class="'+(d.ngt4[x[0]]===false?'on':'')+'">いいえ</button></div>').join('')
      + '<p class="small">自己記録に留め、相手への評価には使いません。</p></div>';
    h += '<h2 class="sec">追加点検: 社長の自己点検（夜の3項目）</h2><div class="card">'
      + '<p class="small" style="margin-top:0;">強く叱責した日に確認する項目です（NGT-05）。</p>'
      + [['q1','その指導は、相手がいない場所で同じ内容・同じ言い方で説明できるか'],['q2','叱った後に、相手が次にどうすればよいかが伝わる形で終わっていたか'],['q3','自分の機嫌・繁忙・私的な事情が、叱責の強さに混ざっていなかったか']].map(x=>
        '<label class="fl">'+x[1]+'</label><div class="yn">'
        + '<button data-n5="'+x[0]+':true" class="'+(d.ngt5[x[0]]===true?'on':'')+'">はい</button>'
        + '<button data-n5="'+x[0]+':false" class="'+(d.ngt5[x[0]]===false?'on':'')+'">いいえ</button></div>').join('')
      + '</div>';
  }
  h += '<button class="btn gold" id="rvSave">記録を保存する</button>'
    + '<p class="small">詳しい型は「探す・聞く」の「夜の振り返り」からいつでも開けます。</p>';
  $main.innerHTML = h;
  document.getElementById('bk').addEventListener('click', ()=>{ revDraft=null; go('today'); });
  document.getElementById('rvTheme').addEventListener('change', e=>{ syncReviewInputs(); d.theme=e.target.value; renderReview(); });
  $main.querySelectorAll('[data-score]').forEach(b=>b.addEventListener('click', ()=>{ syncReviewInputs(); d.score=parseInt(b.dataset.score); renderReview(); }));
  $main.querySelectorAll('[data-did]').forEach(b=>b.addEventListener('click', ()=>{ syncReviewInputs(); d.did=b.dataset.did; renderReview(); }));
  $main.querySelectorAll('[data-n3]').forEach(b=>b.addEventListener('click', ()=>{ syncReviewInputs(); d.ngt3done = b.dataset.n3==='yes'; renderReview(); }));
  $main.querySelectorAll('[data-reason]').forEach(b=>b.addEventListener('click', ()=>{ syncReviewInputs(); d.ngt3reason=b.dataset.reason; renderReview(); }));
  $main.querySelectorAll('[data-n4]').forEach(b=>b.addEventListener('click', ()=>{ syncReviewInputs(); const [k,v]=b.dataset.n4.split(':'); d.ngt4[k]=(v==='true'); renderReview(); }));
  $main.querySelectorAll('[data-n5]').forEach(b=>b.addEventListener('click', ()=>{ syncReviewInputs(); const [k,v]=b.dataset.n5.split(':'); d.ngt5[k]=(v==='true'); renderReview(); }));
  document.getElementById('rvSave').addEventListener('click', ()=>{
    syncReviewInputs();
    const r = dayRec(td);
    r.review = { theme:d.theme, themeLabel: themeText, score:d.score, did:d.did, memo:d.memo,
      goods:d.goods.filter(g=>g.t||g.w), ngt3:{done:d.ngt3done, reason:d.ngt3reason},
      ngt4:d.ngt4, ngt5:d.ngt5, savedAt:new Date().toISOString() };
    save(K.records, records); revDraft=null; toast('記録を保存しました'); go('records');
  });
  function syncReviewInputs(){
    const m=document.getElementById('rvMemo'); if(m) d.memo=m.value;
    $main.querySelectorAll('[data-good-t]').forEach(inp=>{ d.goods[parseInt(inp.dataset.goodT)].t = inp.value; });
    $main.querySelectorAll('[data-good-w]').forEach(inp=>{ d.goods[parseInt(inp.dataset.goodW)].w = inp.value; });
  }
}
</script>
<script>
"use strict";
/* ---------- 記録 ---------- */
function renderRecords(){
  let h = '<h1 class="page">記録</h1><p class="lead">実践度と反応メモの蓄積です。比べるためのものではありません。</p>';
  h += '<div class="card tap" id="wk"><div class="kicker">任意</div><div class="tname">週次の振り返り（経験学習サイクル）</div><p class="small" style="margin:6px 0 0;">1週間に1回、経験を1つ選んで教訓に変える振り返りです。毎日の必須ではありません。</p></div>';
  const dates = Object.keys(records).filter(ds=>records[ds].review && records[ds].review.savedAt).sort().reverse();
  if(!dates.length){ h += '<div class="card"><p class="lead" style="margin:0;">まだ記録がありません。今日の夜の振り返りから始まります。</p></div>'; }
  dates.forEach(ds=>{
    const r = records[ds], rv = r.review;
    const mt = r.morningTypeId ? TYPE_BY_ID[r.morningTypeId] : null;
    h += '<div class="card tap" data-day="'+ds+'"><div class="dayrow"><span class="dt">'+esc(dateLabel(ds))+'</span>'
      + '<span class="stat">実践度 '+(rv.score||'―')+'／10　'+(rv.did||'')+'</span></div>'
      + '<p class="small" style="margin:6px 0 0;">朝の型: '+(mt?esc(mt.name):'―')+(rv.memo ? '<br>反応メモ: '+esc(rv.memo) : '')+'</p></div>';
  });
  $main.innerHTML = h;
  document.getElementById('wk').addEventListener('click', ()=>go('weekly'));
  $main.querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click', ()=>go('day', el.dataset.day)));
}
function ynLabel(v){ return v===true?'はい':(v===false?'いいえ':'―'); }
function renderDay(ds){
  const r = records[ds]; if(!r || !r.review){ go('records'); return; }
  const rv = r.review; const mt = r.morningTypeId ? TYPE_BY_ID[r.morningTypeId] : null;
  let h = '<button class="back" id="bk">← 戻る</button><h1 class="page">'+esc(dateLabel(ds))+'</h1>';
  h += '<div class="card"><div class="kicker">朝の提示</div><div class="tname" style="font-size:1rem;">'+(mt?esc(mt.name):'―')+'</div></div>';
  h += '<h2 class="sec">夜の振り返り</h2><div class="card">'
    + '<p style="margin:4px 0;"><strong>テーマ:</strong> '+esc(rv.themeLabel||'')+'</p>'
    + '<p style="margin:4px 0;"><strong>実践度:</strong> '+(rv.score||'―')+'／10　<strong>実践の有無:</strong> '+(rv.did||'―')+'</p>'
    + (rv.memo ? '<p style="margin:4px 0;"><strong>相手の反応メモ:</strong> '+esc(rv.memo)+'</p>' : '');
  if(rv.goods && rv.goods.length){
    h += '<div class="hr"></div><p style="margin:4px 0;"><strong>3つの良いこと</strong></p>'
      + rv.goods.map(g=>'<p style="margin:6px 0;">・'+esc(g.t)+(g.w?'<br><span class="small">なぜ起きたか: '+esc(g.w)+'</span>':'')+'</p>').join('');
  }
  if(rv.ngt3 && typeof rv.ngt3.done==='boolean'){
    h += '<div class="hr"></div><p style="margin:4px 0;"><strong>称賛と再設計:</strong> '+(rv.ngt3.done ? 'できた' : 'できなかった'+(rv.ngt3.reason?'（理由: '+esc(rv.ngt3.reason)+'）':''))+'</p>';
  }
  if(rv.ngt4 && (rv.ngt4.q1!==null && rv.ngt4.q1!==undefined)){
    h += '<div class="hr"></div><p style="margin:4px 0;"><strong>追加点検（NGT-04）:</strong> 人格へ向いたサインが出ていなかったか '+ynLabel(rv.ngt4.q1)+'／話を仕事に戻せたか '+ynLabel(rv.ngt4.q2)+'／次に試す1点を決めたか '+ynLabel(rv.ngt4.q3)+'</p>';
  }
  if(rv.ngt5 && (rv.ngt5.q1!==null && rv.ngt5.q1!==undefined)){
    h += '<p style="margin:4px 0;"><strong>社長の自己点検（NGT-05）:</strong> 説明可能性 '+ynLabel(rv.ngt5.q1)+'／次の一手が伝わる終わり方 '+ynLabel(rv.ngt5.q2)+'／私的な事情の混入なし '+ynLabel(rv.ngt5.q3)+'</p>';
  }
  h += '</div>';
  if(ds===todayStr()){ h += '<button class="btn" id="editRev">今日の振り返りを直す</button>'; }
  $main.innerHTML = h;
  document.getElementById('bk').addEventListener('click', ()=>go('records'));
  const er=document.getElementById('editRev'); if(er) er.addEventListener('click', ()=>go('review'));
}
function renderWeekly(){
  let h = '<button class="back" id="bk">← 戻る</button><h1 class="page">週次の振り返り</h1>'
    + '<p class="lead">経験を1つ選び、事実→内省→教訓→応用の順で書きます（NGT-06）。教訓は「次は〜する／〜はやめる」の行動の文にします。</p>'
    + '<div class="card">'
    + '<label class="fl" style="margin-top:0;">事実（何があったか。解釈を混ぜない）</label><textarea id="wkFact"></textarea>'
    + '<label class="fl">内省（どう感じたか／なぜそう動いたか／相手からはどう見えたか）</label><textarea id="wkRef"></textarea>'
    + '<label class="fl">教訓（「〜の場面では、〜すると〜になる」＋行動の形で1文）</label><textarea id="wkLes"></textarea>'
    + '<label class="fl">応用（その教訓を試す次の場面。いつ・誰との・何の場面か）</label><textarea id="wkApp"></textarea>'
    + '<button class="btn gold" id="wkSave">保存する</button></div>';
  if(weekly.length){
    h += '<h2 class="sec">今までの週次記録</h2>' + weekly.slice().reverse().map(w=>
      '<div class="card"><div class="dt" style="font-family:var(--serif); color:var(--navy); font-weight:600;">'+esc(dateLabel(w.date))+'</div>'
      + '<p style="margin:6px 0;"><strong>事実:</strong> '+esc(w.fact)+'</p>'
      + '<p style="margin:6px 0;"><strong>内省:</strong> '+esc(w.reflection)+'</p>'
      + '<p style="margin:6px 0;"><strong>教訓:</strong> '+esc(w.lesson)+'</p>'
      + '<p style="margin:6px 0;"><strong>応用:</strong> '+esc(w.apply)+'</p></div>').join('');
  }
  const t6 = ngtType('NGT-06');
  if(t6){ h += '<details><summary>型の詳細を見る（NGT-06）</summary>'+typeDetailHTML(t6, false)+'</details>'; }
  $main.innerHTML = h;
  document.getElementById('bk').addEventListener('click', ()=>go('records'));
  document.getElementById('wkSave').addEventListener('click', ()=>{
    weekly.push({ date: todayStr(),
      fact: document.getElementById('wkFact').value, reflection: document.getElementById('wkRef').value,
      lesson: document.getElementById('wkLes').value, apply: document.getElementById('wkApp').value });
    save(K.weekly, weekly); toast('保存しました'); renderWeekly();
  });
}

/* ---------- 典拠・設定 ---------- */
const ABOUT_HTML = '<div class="about">'
  + '<h2 class="sec" style="margin-top:6px;">名前の由来 — LEADER\'S ANSWER</h2>'
  + '<p>リーダーは、答えを出さなければならない立場にいます。<br>部下の前では迷いを見せられず、判断の理由を確かめる相手も、たいていはいません。<br>決めるのはいつも自分で、その重さを引き受けるのも自分です。</p>'
  + '<p>このアプリは、その「答え」を配るアプリではありません。<br>世界の実践者と研究を、出どころの確認できたものだけ116件以上読み込み、<br>現場で使える「型」に整えました。<br>毎朝の問いと、夜の振り返り。<br>その積み重ねの中で、答えは少しずつ、あなたの中に育っていきます。</p>'
  + '<p>LEADER\'S ANSWER という名前の ANSWER は、<br>もらう答えではなく、辿り着く答えのことです。<br>決める人のそばに、確かな型と問いを置く。<br>それが、このアプリの仕事です。</p></div>';
function profileSummary(){
  if(!profile) return '未入力';
  const parts = [];
  const r = ROLES.find(x=>x.key===profile.role); if(r) parts.push(r.label);
  const j = JOBS.find(x=>x.key===profile.job); if(j) parts.push(j.label);
  if(profile.shift) parts.push('交代勤務・夜勤あり');
  if(profile.oncall) parts.push('当直・オンコールあり');
  if(profile.family===true) parts.push('家族経営');
  if(profile.interests && profile.interests.length) parts.push('関心: '+profile.interests.map(k=>SCENE_LABEL[k]||k).join('、'));
  return parts.length ? parts.join('／') : '未入力';
}
function renderSettings(){
  let h = '<h1 class="page">典拠・設定</h1>';
  h += '<div class="card">'+ABOUT_HTML+'</div>';
  h += '<h2 class="sec">約款の要点</h2><div class="card">'
    + '<p style="margin:6px 0;"><strong>このアプリがすること</strong></p>'
    + '<ul class="plain"><li>出典と根拠の格付けを確認できる形で、現場で使える「型」を提示します</li>'
    + '<li>答えられない範囲は、範囲として正直に示し、該当する相談先・公的窓口へ案内します</li>'
    + '<li>実践度と反応メモを、本人が見返せる記録として残します</li></ul>'
    + '<p style="margin:12px 0 6px;"><strong>このアプリがしないこと</strong></p>'
    + '<ul class="plain"><li>効果の断定・保証はしません</li>'
    + '<li>人や事案の判定・診断・ラベル貼りはしません</li>'
    + '<li>法律・医療・税務などの専門判断の代わりにはなりません</li>'
    + '<li>記録の共有・ランキング・連続記録の競争は持ちません</li></ul>'
    + '<p style="margin:12px 0 6px;"><strong>記録について</strong></p>'
    + '<ul class="plain"><li>記録はこの端末の中にだけ保存され、サーバへは送りません</li>'
    + '<li>端末の紛失・故障・機種変更で、記録が失われることがあります</li>'
    + '<li>ハラスメントに関する記録は、通常の記録とは別の領域に分けて保管する設計です（記録の入力とロックは、次のステップで追加されます）</li></ul>'
    + '</div>';
  h += '<h2 class="sec">型データ</h2><div class="card">'
    + '<p style="margin:4px 0;">試作セット（2026-11-11確定）／型 '+TYPES.length+'件／チェック項目 '+CHECKS_COUNT+'件</p>'
    + '<p class="small" style="margin:4px 0;">全ての型に、出典（カードID＋典拠）と根拠の格付け（性質×形）を付けています。確認日: 2026-11-11。法制に関わる型は、年1回以上の照合が必要です。</p></div>';
  h += '<h2 class="sec">プロフィール</h2><div class="card">'
    + '<p style="margin:4px 0;">'+esc(profileSummary())+'</p>'
    + '<button class="btn ghost small" id="editProfile">プロフィールを編集する</button></div>';
  h += '<h2 class="sec">データの削除</h2><div class="card">'
    + '<p class="small" style="margin-top:0;">プロフィール・記録・チェックの状態を、この端末からすべて消します。元には戻せません。</p>'
    + '<button class="btn ghost small" id="delAll" style="border-color:var(--red); color:var(--red);">データを完全に削除する</button></div>';
  $main.innerHTML = h;
  document.getElementById('editProfile').addEventListener('click', ()=>{ profDraft=null; go('profile', 0); });
  document.getElementById('delAll').addEventListener('click', ()=>{
    if(!confirm('すべてのデータを削除します。よろしいですか？')) return;
    if(!confirm('本当に削除しますか？ 元には戻せません。')) return;
    Object.values(K).forEach(k=>localStorage.removeItem(k));
    profile=null; records={}; rotation={shown:{}}; morning={}; checksState={}; weekly=[];
    save(K.harass, {records:[]});
    toast('削除しました'); go('today');
  });
}
const CHECKS_COUNT = CHECKLISTS.reduce((n,c)=>n+(c.items?c.items.length:0),0);
go('today');
</script>
